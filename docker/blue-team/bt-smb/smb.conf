[global]
   workgroup = LABGROUP
   server string = Blue Team SMB Server %v
   netbios name = bt-smb

   # SMBv1 habilitado — compatible con enum4linux, vulnerable a enumeracion legacy
   min protocol = NT1
   max protocol = SMB3

   # Sin firma de paquetes — vulnerable a relay attacks (MitM)
   server signing = disabled
   client signing = disabled

   # NTLMv1 habilitado — vulnerable a captura y crackeo offline con Responder
   ntlm auth = yes
   lanman auth = yes

   # Null sessions permitidas — enumeracion sin credenciales
   map to guest = Bad User
   guest account = nobody

   log level = 1

[public]
   path = /srv/samba/public
   browseable = yes
   writable = yes
   guest ok = yes
   read only = no
   create mask = 0777
   comment = Public share — sin autenticacion

[private]
   path = /srv/samba/private
   browseable = yes
   writable = yes
   valid users = smbuser admin
   read only = no
   create mask = 0755
   comment = Private share — credenciales debiles
